# ===============================================
# SIMPLE DOCKER DEPLOYMENT (Production-like)
# ===============================================
# This is a simple Docker setup for running the app only
# Uses Supabase cloud database (no local PostgreSQL)
#
# Usage:
#   docker-compose up -d
#
# For full staging environment with PostgreSQL, use:
#   docker-compose -f docker-compose.staging.yml up -d
# ===============================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: elearning-platform
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    restart: unless-stopped
    networks:
      - elearning-network

networks:
  elearning-network:
    driver: bridge
