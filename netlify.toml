# Netlify Configuration for Frontend Deployment

[build]
  # Base directory where frontend code lives
  base = "frontend"

  # Build command
  command = "npm run build"

  # Directory with built files
  publish = "dist"

# Environment variables (set in Netlify UI, not here)
# VITE_API_URL = "https://your-backend-url.onrender.com/api"
# VITE_STRIPE_PUBLIC_KEY = "pk_live_your_key"

# Redirect all requests to index.html for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
