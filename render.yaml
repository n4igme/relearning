# Render.com Configuration for Backend Deployment
# This file allows easy deployment to Render

services:
  # Backend API Service
  - type: web
    name: elearning-backend
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      # The following should be set in Render dashboard as secrets:
      # MONGODB_URI (get from MongoDB Atlas)
      # JWT_SECRET
      # JWT_REFRESH_SECRET
      # SMTP_HOST
      # SMTP_PORT
      # SMTP_EMAIL
      # SMTP_PASSWORD
      # FROM_EMAIL
      # FROM_NAME
      # STRIPE_SECRET_KEY
      # STRIPE_PUBLISHABLE_KEY
    healthCheckPath: /api/health

  # Uncomment if you want Render to also host your frontend
  # - type: web
  #   name: elearning-frontend
  #   env: static
  #   buildCommand: cd frontend && npm install && npm run build
  #   staticPublishPath: frontend/dist
  #   routes:
  #     - type: rewrite
  #       source: /*
  #       destination: /index.html
